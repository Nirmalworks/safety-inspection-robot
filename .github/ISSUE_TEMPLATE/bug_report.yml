name: Bug report
description: Something on the robot, in simulation or in the ML tools does not work
labels: [bug]
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [Mapping / SLAM, Localization (AMCL / EKF), Navigation / patrol, Inspection / ML, Dashboard, Simulation, Other]
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where did it happen?
      options: [Robot (Jetson Nano), Simulation (laptop), Offline ML tools]
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ros2 launch ame505_bringup navigation_2d.launch.py map:=...
        2. ...
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Attach the folder from ./scripts/save_debug_bundle.sh if it was on the robot.
      render: text
  - type: input
    id: commit
    attributes:
      label: Branch / commit
      placeholder: dev @ abc1234
